name: tests

on:
  push:
  pull_request:
  # A weekly run catches breakage from new upstream releases (Laravel, PHPUnit, PHP itself)
  # even when nothing is pushed here. Without it CI stayed silent from 6 October onwards.
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC; an odd minute avoids GitHub's top-of-hour queue
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        laravel: ['12.*', '13.*']
        variant: ['default']
        include:
          # enlightn/security-checker (dev-only, for the deprecated driver) caps symfony/console
          # at ^7, so the default jobs never see Symfony 8. Without it, Laravel 13 resolves
          # Symfony 8, which is what Laravel 14 will require.
          - php: '8.5'
            laravel: '13.*'
            variant: 'symfony-8'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}${{ matrix.variant != 'default' && format(' ({0})', matrix.variant) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: pcov

      - name: Drop the deprecated Enlightn driver's dependency
        if: matrix.variant != 'default'
        run: composer remove --dev enlightn/security-checker --no-update

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts=${{ matrix.laravel }}" --prefer-stable --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show the resolved Laravel and Symfony versions
        # `composer show` takes a single package name, hence the loop.
        run: |
          for package in laravel/framework symfony/console; do
            composer show "$package" | grep -E '^(name|versions) +:'
          done

      - name: Execute tests
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist

  laravel-14-dev:
    # Laravel 14 is not released yet. This job shows whether 4.x works with its development
    # branch, but it cannot install until laravel/slack-notification-channel allows Laravel 14
    # (its newest release requires illuminate/notifications ^12|^13). Until then it would only
    # ever be red, so it runs on demand (Actions > tests > Run workflow) instead of on every push.
    # The symfony-8 job above covers what actually blocked Laravel 14: Symfony 8.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    name: PHP 8.5 - Laravel 14 (dev-master)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      - name: Install dependencies
        run: |
          # enlightn/security-checker caps symfony/console at ^7; Laravel 14 requires Symfony 8.
          composer remove --dev enlightn/security-checker --no-update
          composer config minimum-stability dev
          composer config prefer-stable true
          # laravel/framework's dev-master has no 14.x branch alias yet. The inline alias makes
          # it (and the illuminate/* packages it replaces) count as 14.0.0, so it satisfies this
          # package's ^14.0 constraints; Testbench 12.x-dev is the branch that targets it.
          composer require --dev "laravel/framework:dev-master as 14.0.0" "orchestra/testbench:12.x-dev" --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show the resolved Laravel and Symfony versions
        run: |
          for package in laravel/framework symfony/console; do
            composer show "$package" | grep -E '^(name|versions) +:'
          done

      - name: Execute tests
        run: vendor/bin/phpunit --configuration=phpunit.xml.dist

  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported PHP for each Laravel major: the e2e suite is slower,
        # so it covers the edges instead of the full matrix above.
        include:
          - laravel: '12'
            php: '8.3'
          - laravel: '12'
            php: '8.5'
          - laravel: '13'
            php: '8.3'
          - laravel: '13'
            php: '8.5'

    name: E2E - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, json, openssl
          coverage: none

      - name: Install package dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Create Laravel ${{ matrix.laravel }} app with this package
        run: tests/E2E/bin/create-app.sh ${{ matrix.laravel }} "$RUNNER_TEMP/app"

      - name: Execute e2e tests
        run: vendor/bin/phpunit --configuration=phpunit.e2e.xml.dist
        env:
          E2E_APP_PATH: ${{ runner.temp }}/app
