name: nightly real source

# The regular test suites only ever see offline fixtures, so they cannot notice when the
# real advisory sources change or break. This workflow does, every night:
#
#  1. a fresh Laravel app runs security-check:now against live Packagist (the default
#     driver) and against the live FriendsOfPHP archive (the deprecated "enlightn" driver), and
#  2. the full Packagist feed is compared with per-package querying and with `composer audit`,
#     on the app's own lock file and on a deliberately outdated one with hundreds of known
#     vulnerabilities, so the privacy-friendly default can never silently report less.
#
# A failing scheduled run notifies the maintainer through GitHub's usual workflow emails.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-source:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        driver: ['packagist', 'packagist-per-package', 'enlightn']

    name: security-check:now (${{ matrix.driver }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      - name: Create Laravel 13 app with this package
        run: tests/E2E/bin/create-app.sh 13 "$RUNNER_TEMP/app"

      - name: Run security-check:now against the live advisory source
        working-directory: ${{ runner.temp }}/app
        env:
          LCS_DRIVER: ${{ matrix.driver }}
        run: |
          # 0 = nothing found, 1 = vulnerabilities found (both fine here: the live data decides),
          # 2 = the check could not run, which is exactly what this job exists to catch.
          set +e
          php artisan security-check:now --no-ansi | tee "$RUNNER_TEMP/report.txt"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -gt 1 ]; then
            echo "::error::security-check:now with the $LCS_DRIVER driver exited with $status (the check could not run)"
            exit 1
          fi

          # Belt and braces: the report header is only printed once advisories were fetched.
          if ! grep -q '^Security Check Report: ' "$RUNNER_TEMP/report.txt"; then
            echo "::error::security-check:now with the $LCS_DRIVER driver did not produce a report"
            exit 1
          fi

  compare-sources:
    runs-on: ubuntu-latest

    name: full feed vs per-package vs composer audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, json
          coverage: none

      - name: Create Laravel 13 app with this package
        run: tests/E2E/bin/create-app.sh 13 "$RUNNER_TEMP/app"

      - name: Compare the advisory sources
        run: |
          php tests/E2E/bin/compare-advisory-sources.php "$RUNNER_TEMP/app" \
            "$RUNNER_TEMP/app/composer.lock" \
            tests/E2E/fixtures/outdated-composer.lock
