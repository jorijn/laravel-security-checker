version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
  # Keeps actions/checkout and shivammathur/setup-php current, so a deprecated action
  # version never silently breaks the scheduled runs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
